name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned rather than ubuntu-latest, which moves to a new Ubuntu release on
    # GitHub's schedule. Change it on purpose, after a test run on the new image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The tests use Google Chrome. The runner image includes it; install it
      # only if an image ever comes without it.
      - run: command -v google-chrome || npx playwright install --with-deps chrome
      - run: npm run lint
      # A failing test stops the job, so a broken build never reaches the site.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
