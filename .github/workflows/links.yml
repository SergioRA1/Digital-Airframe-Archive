name: Links

# Once a week, check that every hotlinked photo and every reference link
# still works. If any are broken, open an issue listing them (or update the
# open one); when they are all fixed, close it.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    # Same image as deploy.yml.
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Broken links
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The script uses only Node's own modules, so no npm ci is needed.
      - id: check
        run: node scripts/check-links.js --report report.md
        continue-on-error: true
      - name: Open, update or close the issue
        run: |
          issue=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -s report.md ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file report.md
              gh issue comment "$issue" --body "Still broken on $(date -u +%F)."
            else
              gh issue create --title "$TITLE" --body-file report.md
            fi
          elif [ "${{ steps.check.outcome }}" = "success" ] && [ -n "$issue" ]; then
            gh issue close "$issue" --comment "All links work again ($(date -u +%F))."
          fi
      - name: Fail the run if links are broken
        if: steps.check.outcome != 'success'
        run: exit 1
