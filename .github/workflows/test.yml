name: Lint and test

# Shared by deploy.yml (pushes to main) and checks.yml (pull requests), so
# both run exactly the same checks. The browser tests are split across six
# machines that run at the same time.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    # Pinned rather than ubuntu-latest, which moves to a new Ubuntu release on
    # GitHub's schedule. Change it on purpose, after a test run on the new image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: test (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    strategy:
      # Let every part finish, so one run shows all failing tests.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The tests use Google Chrome. The runner image includes it; install it
      # only if an image ever comes without it.
      - run: command -v google-chrome || npx playwright install --with-deps chrome
      - run: npx playwright test --shard=${{ matrix.shard }}/6
