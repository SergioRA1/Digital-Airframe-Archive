name: Checks

# Lint and test pull requests, including Dependabot updates, before they are
# merged. Pushes to main are checked by deploy.yml.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    # Same image as deploy.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The tests use Google Chrome. The runner image includes it; install it
      # only if an image ever comes without it.
      - run: command -v google-chrome || npx playwright install --with-deps chrome
      - run: npm run lint
      - run: npm test
