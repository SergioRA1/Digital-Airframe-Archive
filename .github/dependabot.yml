version: 2
updates:
  # Minor and patch updates arrive as one weekly pull request, so they are
  # quick to review. Major updates come one at a time.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
