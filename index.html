<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050708" />
    <meta name="color-scheme" content="dark" />
    <!-- page-meta: scripts/prerender.js replaces this block in each page's
         own HTML file with its title, description, canonical address and
         language alternates. -->
    <title>Airframe | Digital Aircraft Archive</title>
    <meta
      name="description"
      content="An interactive digital exhibition of modern combat aircraft"
    />
    <meta property="og:title" content="Airframe | Digital Aircraft Archive" />
    <meta
      property="og:description"
      content="An interactive digital exhibition of modern combat aircraft"
    />
    <meta
      property="og:url"
      content="https://sergiora1.github.io/Digital-Airframe-Archive/"
    />
    <!-- Link previews need an absolute image URL, so this one names the live
         site. Each built page gets its own image from scripts/prerender.js. -->
    <meta
      property="og:image"
      content="https://sergiora1.github.io/Digital-Airframe-Archive/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Airframe: The Hangar, with a J-20 silhouette"
    />
    <!-- /page-meta -->
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>

  <body>
    <!-- scripts/prerender.js fills #root with each page's text and links, for
         search engines and link previews. React replaces it when it starts. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
